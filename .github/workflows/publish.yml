name: Publish

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  IMAGE_NAME: ghcr.io/luwisp/auv-harness-agent

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Verify release tag matches Cargo version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          package_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "harnessAgent") | .version')"
          if [[ "v${package_version}" != "${GITHUB_REF_NAME}" ]]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} does not match Cargo package version v${package_version}"
            exit 1
          fi
      - name: Run all targets
        run: bash .github/scripts/run-cargo-test.sh cargo test --all-targets --locked -- --test-threads=1
      - name: Run documentation tests
        run: cargo test --doc --locked

  container:
    name: Publish container image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  binary-release:
    name: Publish tagged Linux binary
    needs: [verify, container]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Build and package binary
        run: |
          cargo build --release --locked
          mkdir -p dist
          cp target/release/auv "dist/auv-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu"
          cd dist
          sha256sum "auv-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu" > "auv-${GITHUB_REF_NAME}-SHA256SUMS"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
