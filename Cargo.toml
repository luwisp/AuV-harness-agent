[package]
name = "harnessAgent"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[lib]
name = "harness_agent"
path = "src/lib.rs"

[[bin]]
name = "auv"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
chrono = { version = "0.4", features = ["serde"] }
keyring = "3"
rpassword = "7"
async-trait = "0.1"
thiserror = "2"
regex = "1"
glob = "0.3"
uuid = { version = "1", features = ["v4"] }
ring = "0.17"
aes-gcm = "0.10"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
toml = "0.8"
dirs = "5"
rustyline = "15"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"
unicode-width = "0.2"
wiremock = "0.6"
